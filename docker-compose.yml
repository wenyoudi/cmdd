services:
  cassandra-1:
    image: cassandra:5.0
    container_name: cassandra-1
    hostname: cassandra-1

    environment:
      CASSANDRA_CLUSTER_NAME: consistency-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_SEEDS: cassandra-1
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 200M

    ports:
      - "9042:9042"

    volumes:
      - cassandra1-data:/var/lib/cassandra

    networks:
      - cassandra-network

networks:
  cassandra-network:
    driver: bridge

volumes:
  cassandra1-data: